<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#050505" rx="16"/>

  <!-- GRID HALUS -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- GARIS BIRU GERAK -->
  <line x1="0" y1="340" x2="1200" y2="60" stroke="#2563eb" stroke-width="3" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- GRAFIK KANAN -->
  <polyline points="720,300 770,250 820,270 870,210 920,230 970,170 1020,190 1070,130 1120,150" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,700;700,0" dur="3.5s" repeatCount="indefinite"/>
  </polyline>
  <circle cx="870" cy="210" r="5" fill="#fff"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="970" cy="170" r="5" fill="#60a5fa"><animate attributeName="r" values="3;6;3" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="1070" cy="130" r="6" fill="#fff"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>

  <!-- BAR CHART KECIL - NAIK TURUN -->
  <g fill="#2563eb">
    <rect x="70" y="330" width="22" height="30" rx="3"><animate attributeName="height" values="20;50;20" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="340;310;340" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="100" y="330" width="22" height="30" rx="3"><animate attributeName="height" values="30;60;30" dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="330;300;330" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="130" y="330" width="22" height="30" rx="3"><animate attributeName="height" values="15;45;15" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="345;315;345" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="160" y="330" width="22" height="30" rx="3"><animate attributeName="height" values="40;65;40" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="320;295;320" dur="3.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- TEKS GEDE - INI YANG KEMARIN KECIL, SEKARANG UDAH GEDE -->
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" fill="#ffffff">NICO ALFIANTO</text>
  <text x="72" y="200" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#9ca3af" letter-spacing="10">DATA ANALYST</text>
  <text x="72" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#60a5fa">Data → Insights → Decisions</text>
  <text x="72" y="285" font-family="monospace" font-size="16" fill="#6b7280">Python  •  SQL  •  Power BI  •  Excel  •  Laravel</text>

  <!-- GARIS BAWAH JALAN -->
  <rect x="70" y="300" width="200" height="3" fill="#60a5fa" rx="2">
    <animate attributeName="width" values="80;350;80" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- BADGE OPEN TO WORK -->
  <g>
    <rect x="1010" y="28" width="130" height="30" rx="15" fill="#111111" stroke="#333333"/>
    <circle cx="1032" cy="43" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="1045" y="48" font-family="Arial" font-size="13" fill="#ffffff">OPEN TO WORK</text>
  </g>
</svg>
