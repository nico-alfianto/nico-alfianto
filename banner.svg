<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background gelap -->
  <rect width="1200" height="400" fill="url(#bg)" rx="20"/>

  <!-- Garis diagonal yang GERAK -->
  <line x1="-100" y1="350" x2="1300" y2="50" stroke="url(#blue)" stroke-width="3" opacity="0.9">
    <animate attributeName="x1" values="-100;0;-100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1300;1200;1300" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="-100" y1="370" x2="1300" y2="70" stroke="#2563eb" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Titik-titik data yang kedip -->
  <circle cx="850" cy="130" r="5" fill="#38bdf8">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="220" r="5" fill="#38bdf8">
    <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="150" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Grafik garis yang jalan -->
  <polyline points="750,280 800,240 850,260 900,200 950,220 1000,160 1050,180 1100,120" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,600;600,0" dur="3s" repeatCount="indefinite"/>
  </polyline>

  <!-- Teks -->
  <text x="80" y="170" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" letter-spacing="2">NICO ALFIANTO</text>
  <text x="82" y="215" font-family="Arial, sans-serif" font-size="24" fill="#9ca3af" letter-spacing="6">DATA ANALYST</text>
  <text x="82" y="260" font-family="Arial, sans-serif" font-size="16" fill="#60a5fa">Data → Insights → Decisions</text>

  <!-- Stack kecil di bawah, gak alay -->
  <text x="82" y="320" font-family="monospace" font-size="14" fill="#6b7280">Python  •  SQL  •  Power BI  •  Excel  •  Laravel</text>

  <!-- Garis bawah yang gerak -->
  <rect x="80" y="340" width="200" height="3" fill="#2563eb" rx="2">
    <animate attributeName="width" values="50;300;50" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
