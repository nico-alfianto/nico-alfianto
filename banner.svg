<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND HITAM -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>

  <!-- GRID HALUS - kayak porto lu -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- GARIS DIAGONAL UTAMA - GERAK PELAN -->
  <line x1="-50" y1="340" x2="1250" y2="60" stroke="url(#blue)" stroke-width="2.5" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="-50" y1="360" x2="1250" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- AREA CHART DI KANAN - RAME TAPI GAK ALAY -->
  <path d="M720,300 L760,260 L800,275 L840,220 L880,240 L920,180 L960,200 L1000,150 L1040,170 L1080,120 L1120,140 L1120,300 Z" fill="url(#fade)"/>
  <polyline points="720,300 760,260 800,275 840,220 880,240 920,180 960,200 1000,150 1040,170 1080,120 1120,140" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,800;800,0" dur="4s" repeatCount="indefinite"/>
  </polyline>

  <!-- TITIK DATA - KEDIP -->
  <circle cx="840" cy="220" r="4" fill="#fff"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="180" r="4" fill="#60a5fa"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="150" r="4" fill="#fff"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="120" r="5" fill="#60a5fa"><animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite"/></circle>

  <!-- BAR CHART KECIL DI KIRI BAWAH - NAIK TURUN -->
  <g fill="#1e40af" opacity="0.9">
    <rect x="70" y="330" width="18" height="30" rx="3"><animate attributeName="height" values="20;45;20" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="340;315;340" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="95" y="330" width="18" height="30" rx="3"><animate attributeName="height" values="30;55;30" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="330;305;330" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="120" y="330" width="18" height="30" rx="3"><animate attributeName="height" values="15;40;15" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="345;320;345" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="145" y="330" width="18" height="30" rx="3"><animate attributeName="height" values="35;60;35" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="325;300;325" dur="3.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- TEKS UTAMA -->
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="1">NICO ALFIANTO</text>
  <text x="72" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9ca3af" letter-spacing="8">DATA ANALYST</text>
  <text x="72" y="225" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#60a5fa">Data → Insights → Decisions</text>

  <!-- STACK - TEKS DOANG, GAK PAKE ICON ALAY -->
  <text x="72" y="285" font-family="monospace" font-size="13" fill="#6b7280">Python  •  SQL  •  Power BI  •  Excel  •  Laravel</text>

  <!-- GARIS BAWAH JALAN -->
  <rect x="70" y="300" width="180" height="2" fill="#60a5fa" rx="1">
    <animate attributeName="width" values="60;280;60" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- BADGE KECIL KANAN ATAS -->
  <g>
    <rect x="1020" y="28" width="110" height="26" rx="13" fill="#111111" stroke="#262626"/>
    <circle cx="1040" cy="41" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="1052" y="45" font-family="Arial" font-size="11" fill="#d1d5db" letter-spacing="1">OPEN TO WORK</text>
  </g>
</svg>
